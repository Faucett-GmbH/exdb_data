  - name: Barbell High Bar Squat
    uri: bb-high-bar-squat
    guid: eaa61dc6-5a2c-40ce-9f23-4451577dc3ba
    locale: en
    alternative_names:
      - high bar squat
    video_url: null
    summary: |
      The high bar squat is the foundation of leg strength. Bar sits high on the traps, torso stays upright, knees track forward. Squat deep, drive up hard. This builds quads, glutes, and back strength while reinforcing solid squat mechanics.
    description: |
      The high bar squat is a full-body strength movement that primarily targets the **quadriceps, glutes, and core** while demanding upper back rigidity. With the bar placed high on the traps, the lifter maintains a more **vertical torso**, emphasizing knee flexion and quad engagement. This squat variation is standard for Olympic weightlifters and general strength training due to its full range of motion and carryover to athletic performance.
    instructions: |
      1. **Set the Bar** – Rack the bar at upper chest height. Grip just outside shoulder width, elbows down.  
      2. **Unrack with Control** – Step under the bar, place it on the **upper traps**, not the neck. Stand tall.  
      3. **Brace & Step Back** – Take a deep breath, brace your core, and step back into your stance (just outside shoulder width).  
      4. **Initiate the Descent** – Break at the knees and hips simultaneously, keeping the chest up.  
      5. **Squat Deep** – Lower until your **hip crease is below the knee**, maintaining a vertical torso.  
      6. **Drive Up** – Push through your **midfoot**, drive the bar up, keep the chest tall.  
      7. **Lock Out** – Stand tall at the top, squeeze the glutes, and reset for the next rep.
    tips:
      - Don't let heels or toes lift.
      - Track our knees over toes, not caving inward.
      - Before every rep inhale, expand, and hold tension.
      - Depth matters — parallel isn't enough, get below.
      - Don't let the bar drift forward — keep it balanced over midfoot.
  - name: Kniebeuge mit hoher Stange
    uri: lh-kniebeuge-mit-hoher-stange
    guid: 698bf249-d2cc-4e56-8b91-910631a39949
    locale: de
    alternative_names:
      - High-Bar-Kniebeuge
      - Olympische Kniebeuge
      - Kniebeuge mit hoher Stangenposition
      - Upright Squat
    video_url: null
    summary: |
      Die Kniebeuge mit hoher Stange ist eine Kniebeugenvariante mit der Langhantel auf dem oberen Trapezmuskel. Sie trainiert primär Oberschenkel und Gesäß und wird oft im olympischen Gewichtheben verwendet.
    description: |
      Die Kniebeuge mit hoher Stange ist eine klassische Kniebeugevariante, bei der die Langhantel höher auf dem oberen Trapezmuskel liegt – nicht wie bei der Low-Bar-Version weiter unten auf dem Rücken. Der Torso bleibt dabei aufrechter, die Knie schieben weiter nach vorne, und der Bewegungsradius ist meist tiefer. Das macht sie zu einer bevorzugten Variante im olympischen Gewichtheben und für Athleten, die maximale Beinkraft und Beweglichkeit im Sprunggelenk entwickeln wollen.
    instructions: |
      1. Stelle dich schulterbreit hin, Zehen leicht nach außen gedreht.
      2. Positioniere die Langhantel auf dem oberen Trapezmuskel, direkt unterhalb des Nackens.
      3. Greife die Stange eng, Ellenbogen zeigen nach unten oder leicht hinten.
      4. Spanne Bauch und Rücken an, atme tief in den Bauch.
      5. Beuge Knie und Hüfte gleichzeitig, senke dich kontrolliert ab.
      6. Die Knie folgen den Zehen, der Oberkörper bleibt möglichst aufrecht.
      7. Gehe so tief wie deine Mobilität es erlaubt – idealerweise unter parallel.
      8. Drücke dich explosiv nach oben zurück in den Stand.
      9. Wiederhole.
    tips:
      - Die Fersen bleiben während der gesamten Bewegung fest auf dem Boden.
      - Die Stange soll nicht im Nacken drücken – sie liegt auf dem Muskel, nicht auf der Wirbelsäule.
      - Mobilitätsprobleme? Arbeite an Sprunggelenk und Hüftbeweglichkeit.
      - Depth matters — parallel isn't enough, get below.
      - Don't let the bar drift forward — keep it balanced over midfoot.
