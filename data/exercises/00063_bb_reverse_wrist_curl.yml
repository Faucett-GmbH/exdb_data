    video_url: null
    description: |
      The reverse wrist curl is the forgotten half of forearm training. While the standard wrist curl builds flexors, the reverse version builds the extensors — the muscles on top of the forearm. It’s a small, precise movement that balances your grip strength and keeps your elbows healthy. If you’re serious about wrist stability, aesthetics, or joint durability, you don’t skip this.
    summary: |
      The barbell reverse wrist curl targets the forearm extensors by curling the barbell upward with the wrists in a pronated (palms-down) grip.
    instructions: |
      1. Setup: Kneel on the floor with forearms resting on a bench, palms down, wrists just past the knees.
      2. Grip: Hold the barbell with an overhand (pronated) grip, hands shoulder-width apart.
      3. Curl: Extend the wrists, lifting the back of the hands toward the ceiling.
      4. Squeeze: Pause briefly at the top of the motion.
      5. Lower: Slowly lower the bar back to the starting position.
      6. Repeat: Keep movement strict — forearms stay down, only wrists move.
    tips:
      - Keep reps slow — no jerking.
      - Start light; the extensors are smaller and fatigue fast.
