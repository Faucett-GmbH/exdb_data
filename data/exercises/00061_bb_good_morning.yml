    description: |
      The good morning is a pure hinge — hips back, back tight, hamstrings on stretch. With the bar across your shoulders, you bow forward like a strongman nodding off. It builds posterior chain strength, reinforces spinal rigidity, and teaches perfect hinge mechanics. Often feared, wrongly blamed for injury — but in truth, it's a precision tool for bulletproofing your backside when done right.
    summary: |
      The barbell good morning is a hip hinge movement where the bar rests on your back while you bend forward at the hips, targeting hamstrings, glutes, and spinal erectors.
    instructions: |
      1. Setup: Barbell on traps or rear delts, feet shoulder-width, slight bend in the knees.
      2. Brace: Engage core and upper back.
      3. Hinge: Push hips back, chest forward. Maintain a neutral spine.
      4. Depth: Lower until you feel a strong stretch in hamstrings — torso roughly parallel to floor.
      5. Ascent: Drive hips forward and return to standing.
      6. Repeat: Keep the movement smooth and tight.
    tips:
      - Start light. This is a precision lift, not an ego lift.
      - Keep the spine neutral — if it rounds, you’re too deep or too loose.
      - Great for improving deadlift mechanics and building hip extension strength.
      - Can be used in strength, hypertrophy, or rehab settings.
