    metadata_authors: []
    video_url: null
    description: |
      The wrist curl is a no-frills forearm builder. You sit down, rest your forearms on your thighs or a bench, and curl the bar using only your wrists. It looks simple — and it is — but the forearm burn is real. If you want thicker forearms, a stronger grip, or handshake dominance, this is your go-to. The pump is instant, the pain is honest, and the gains are earned one curl at a time.
    summary: |
      The barbell wrist curl targets the forearm flexors by curling the barbell with just the wrists, typically performed seated with forearms supported.
    instructions: |
      1. Setup: Kneel on the floor with forearms resting on a bench, palms up, barbell in hand.
      2. Grip: Let the bar roll down to the fingers to stretch the forearms.
      3. Curl: Flex the wrists, curling the bar up as high as possible.
      4. Squeeze: Pause at the top and squeeze the forearms.
      5. Lower: Slowly lower the bar back to the stretched position.
      6. Repeat: Keep movement strict — wrists only.
    tips:
      - Use a full range of motion — let the bar roll to fingertips.
      - Keep reps slow and deliberate. Don’t bounce.
