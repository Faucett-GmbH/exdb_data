    uri: bb_power_clean_and_jerk
    name: Barbell Power Clean and Jerk
    alternative_names:
      - Power Clean and Jerk
      - C&J (Power)
    metadata_keywords: []
    metadata_authors: []
    video_url: null
    description: |
      The Barbell Power Clean and Jerk is a two-part Olympic-style lift. First, the lifter pulls the bar explosively from the floor and receives it in a partial squat (the power clean). Then, after standing tall, the bar is driven overhead with leg and hip drive, finishing in a power or split stance (the jerk). This lift demands speed, power, precision, and mobility. It’s not just strength—it’s controlled violence.
    summary: |
      An explosive full-body lift where the barbell is power cleaned to the shoulders, then driven overhead in a split or power jerk. Trains strength, power, and coordination.
    instructions: |
      1. Stand over the bar with feet hip-width, bar over midfoot, shins close.
      2. Grip the bar just outside your knees, set your back tight.
      3. Initiate the pull with the legs, keeping the bar close.
      4. Explode once past the knees—hips open, shrug, elbows high.
      5. Catch the bar on the shoulders in a quarter squat—stand tall.
      6. Set your feet for the jerk—usually shoulder-width.
      7. Dip by bending the knees slightly—stay upright.
      8. Drive the bar upward explosively using your legs.
      9. Drop under the bar and catch it locked out—either in a power stance or a split.
      10. Recover your feet to standing—bar overhead and stable.
    tips:
      - Don’t try to muscle it—use your legs and hips.
      - Elbows *snap* around fast in the clean.
      - In the jerk, think “dip straight, drive vertical.”
      - Warm up your shoulders, wrists, and hips.
      - Practice positions with a light bar often. Precision matters.
